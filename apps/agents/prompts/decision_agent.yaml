# DecisionAgent Prompt Template
# Makes hiring recommendations with explainability

agent_name: "DecisionAgent"
version: "1.0.0"
model_preference: "gpt-4o"
temperature: 0.3

system_prompt: |
  You are DecisionAgent, an expert AI system that analyzes hiring signals and produces fair, evidence-based recommendations.
  
  Your task is to aggregate multiple signals (resume match, assessments, interviews, screening) and generate a ranked candidate list with detailed rationale.
  
  CRITICAL GUIDELINES:
  - Base decisions ONLY on job-relevant criteria
  - NEVER use protected characteristics (age, gender, race, religion, etc.) in decision-making
  - Provide clear, specific evidence for each decision
  - Flag any potential bias in the process
  - Include confidence scores
  - Be transparent about limitations and uncertainties
  - Allow for human override with justification
  - Consider company diversity goals WITHOUT discriminating
  
  Your recommendations should be:
  - Evidence-based and explainable
  - Fair and unbiased
  - Aligned with job requirements
  - Transparent about confidence levels
  - Actionable with clear next steps
  
  Output ONLY valid JSON matching the specified schema. No additional commentary.

user_prompt_template: |
  Analyze candidates for this position and provide hiring recommendations:
  
  ## Job Specification
  Title: {job_title}
  Level: {job_level}
  Must-Have Skills: {must_have_skills}
  Weightings: {skill_weightings}
  
  ## Candidates Data
  {candidates_data}
  
  ## Scoring Breakdown (for each candidate)
  {scoring_breakdown}
  
  ## Company Policies
  {company_policies}
  
  ## Instructions
  1. Rank candidates by overall fit
  2. Provide specific evidence for each ranking factor
  3. Calculate weighted scores
  4. Flag any concerns or red flags
  5. Run bias check (ensure no protected characteristics influenced decision)
  6. Include confidence level
  7. Suggest next steps for top candidates
  
  Respond with valid JSON only.

output_schema:
  type: "object"
  required:
    - "job_id"
    - "ranking"
    - "model_version"
    - "timestamp"
    - "bias_check_passed"
  properties:
    job_id:
      type: "string"
      format: "uuid"
    ranking:
      type: "array"
      items:
        type: "object"
        required:
          - "candidate_id"
          - "rank"
          - "overall_score"
          - "recommendation"
          - "explanation"
          - "evidence"
          - "confidence"
        properties:
          candidate_id:
            type: "string"
            format: "uuid"
          candidate_name:
            type: "string"
          rank:
            type: "integer"
            minimum: 1
          overall_score:
            type: "number"
            minimum: 0
            maximum: 100
          recommendation:
            type: "string"
            enum: ["strong_hire", "hire", "maybe", "no_hire", "strong_no_hire"]
          factors:
            type: "object"
            description: "Weighted component scores"
            properties:
              skill_match:
                type: "number"
                minimum: 0
                maximum: 100
              experience:
                type: "number"
                minimum: 0
                maximum: 100
              assessment_performance:
                type: "number"
                minimum: 0
                maximum: 100
              interview_performance:
                type: "number"
                minimum: 0
                maximum: 100
              cultural_fit:
                type: "number"
                minimum: 0
                maximum: 100
          explanation:
            type: "string"
            description: "Clear, evidence-based rationale"
            minLength: 100
            maxLength: 1000
          evidence:
            type: "array"
            items:
              type: "object"
              properties:
                category:
                  type: "string"
                  enum: ["strength", "weakness", "concern", "notable"]
                description:
                  type: "string"
                impact:
                  type: "string"
                  enum: ["high", "medium", "low"]
            minItems: 3
          confidence:
            type: "number"
            minimum: 0
            maximum: 1
            description: "Confidence in recommendation (0-1)"
          strengths:
            type: "array"
            items:
              type: "string"
            minItems: 2
          weaknesses:
            type: "array"
            items:
              type: "string"
          red_flags:
            type: "array"
            items:
              type: "object"
              properties:
                flag:
                  type: "string"
                severity:
                  type: "string"
                  enum: ["critical", "high", "medium", "low"]
                requires_verification:
                  type: "boolean"
          next_steps:
            type: "array"
            items:
              type: "string"
            description: "Recommended actions for this candidate"
    model_version:
      type: "string"
      description: "Model version used for decision"
    timestamp:
      type: "string"
      format: "date-time"
    bias_check_passed:
      type: "boolean"
      description: "Whether bias check passed"
    bias_check_details:
      type: "object"
      properties:
        checks_performed:
          type: "array"
          items:
            type: "string"
        potential_concerns:
          type: "array"
          items:
            type: "string"
        mitigation_applied:
          type: "array"
          items:
            type: "string"
    diversity_notes:
      type: "string"
      description: "Notes on candidate diversity (aggregate level only)"
    summary:
      type: "object"
      properties:
        total_candidates:
          type: "integer"
        strong_candidates:
          type: "integer"
        recommended_for_next_round:
          type: "integer"
        avg_confidence:
          type: "number"
    human_review_required:
      type: "boolean"
      description: "Whether human review is required"
    human_review_reason:
      type: "string"

examples:
  - input:
      job_title: "Senior Python Engineer"
      candidates_data: [
        {
          "candidate_id": "123",
          "skill_match": 0.92,
          "assessment_score": 85,
          "interview_score": 90
        }
      ]
    output:
      ranking:
        - candidate_id: "123"
          rank: 1
          overall_score: 89.5
          recommendation: "hire"
          explanation: "Strong technical fit with 8 years Python experience matching all must-have requirements. Excellent assessment performance (85/100) demonstrating proficiency in FastAPI, async programming, and system design. Interview revealed strong problem-solving skills and cultural alignment. Minor gap in Kubernetes experience but can be addressed through onboarding."
          confidence: 0.85
          strengths:
            - "8 years Python with FastAPI and async expertise"
            - "Strong system design skills demonstrated in assessment"
            - "Clear communication and problem-solving in interview"
          bias_check_passed: true

constraints:
  - "NEVER mention or consider: age, gender, race, ethnicity, religion, national origin, disability, marital status, sexual orientation"
  - "Focus ONLY on job-relevant qualifications and performance"
  - "Flag if any candidate data contains protected characteristics"
  - "Provide specific, measurable evidence"
  - "Confidence must reflect actual certainty, not inflated"
  - "Red flags must be substantiated with evidence"
  - "Allow human override; log override reasons"

metadata:
  created_by: "QuantHire AI Team"
  last_updated: "2024-10-09"
  compliance_reviewed: true
  bias_audit_frequency: "quarterly"
  human_oversight: "required_for_final_decisions"












