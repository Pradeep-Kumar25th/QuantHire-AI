name: Deploy Non-Prod (Azure AI Hub)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "apps/**"
      - "infra/kubernetes/**"
      - "Dockerfile.*"

env:
  AZURE_RESOURCE_GROUP: rg-ail-wkload-npd-we-01
  AKS_CLUSTER_NAME: aks-ail-npd-we-01
  ACR_NAME: crailnpdwe01
  NAMESPACE: quanthire-nonprod
  IMAGE_TAG: "0.1.5"
  DEPLOY_MANIFEST: infra/kubernetes/nonprod/quanthire.yaml

jobs:
  validate:
    name: Pre-deploy validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install Python test deps
        run: |
          pip install -r apps/api/requirements.txt
          pip install pytest pytest-asyncio
      - name: Run pre-deploy checks (no Docker)
        env:
          JWT_SECRET_KEY: test-jwt-secret-key-with-32-chars-minimum
          APP_ENV: testing
          AUTH_MODE: none
          PYTHONPATH: apps:apps/api:apps/agents:apps/agents/agents:apps/quantchat
        run: |
          python -c "from app.database import engine"
          pytest tests/unit -q
          cd apps/web && npm ci --legacy-peer-deps && npx tsc --noEmit && npm run build

  build-and-push:
    name: Build & Push to ACR
    runs-on: ubuntu-latest
    needs: validate
    strategy:
      matrix:
        include:
          - dockerfile: Dockerfile.backend
            image: quanthire-backend
          - dockerfile: Dockerfile.frontend
            image: quanthire-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: ACR login
        run: az acr login --name ${{ env.ACR_NAME }}
      - name: Build and push
        run: |
          IMAGE=${{ env.ACR_NAME }}.azurecr.io/${{ matrix.image }}:${{ env.IMAGE_TAG }}
          docker build -f ${{ matrix.dockerfile }} --target production -t "$IMAGE" .
          docker push "$IMAGE"

  deploy:
    name: kubectl deploy Non-Prod
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Set AKS context
        run: |
          az aks get-credentials \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --name ${{ env.AKS_CLUSTER_NAME }} \
            --overwrite-existing
      - name: Apply raw Non-Prod manifest
        run: |
          kubectl apply -f ${{ env.DEPLOY_MANIFEST }}
          kubectl rollout status deployment/quanthire-nonprod-api \
            -n ${{ env.NAMESPACE }} --timeout=10m
          kubectl rollout status deployment/quanthire-nonprod-web \
            -n ${{ env.NAMESPACE }} --timeout=10m
      - name: Restart deployments to pull fresh images
        run: |
          kubectl rollout restart deployment/quanthire-nonprod-api \
            -n ${{ env.NAMESPACE }}
          kubectl rollout restart deployment/quanthire-nonprod-web \
            -n ${{ env.NAMESPACE }}
          kubectl rollout status deployment/quanthire-nonprod-api \
            -n ${{ env.NAMESPACE }} --timeout=10m
          kubectl rollout status deployment/quanthire-nonprod-web \
            -n ${{ env.NAMESPACE }} --timeout=10m
      - name: Run database migrations
        run: |
          kubectl exec deploy/quanthire-nonprod-api -n ${{ env.NAMESPACE }} -- \
            alembic upgrade head

  smoke-test:
    name: Smoke test
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Set AKS context
        run: |
          az aks get-credentials \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --name ${{ env.AKS_CLUSTER_NAME }} \
            --overwrite-existing
      - name: Health checks
        run: |
          kubectl wait --for=condition=ready pod \
            -l app.kubernetes.io/component=api \
            -n ${{ env.NAMESPACE }} \
            --timeout=300s
          kubectl wait --for=condition=ready pod \
            -l app.kubernetes.io/component=web \
            -n ${{ env.NAMESPACE }} \
            --timeout=300s
          kubectl exec deploy/quanthire-nonprod-api -n ${{ env.NAMESPACE }} -- \
            curl -sf -H "Host: localhost" http://127.0.0.1:8000/healthz
          kubectl exec deploy/quanthire-nonprod-api -n ${{ env.NAMESPACE }} -- \
            curl -sf -H "Host: localhost" http://127.0.0.1:8000/readyz
          kubectl exec deploy/quanthire-nonprod-web -n ${{ env.NAMESPACE }} -- \
            curl -sf http://127.0.0.1:3000/
          kubectl exec deploy/quanthire-nonprod-web -n ${{ env.NAMESPACE }} -- \
            curl -sf http://127.0.0.1:3000/api/health
