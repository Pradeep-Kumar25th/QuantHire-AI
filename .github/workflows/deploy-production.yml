name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to deploy'
        required: true
        type: string

jobs:
  approve:
    name: Wait for Approval
    runs-on: ubuntu-latest
    environment: production
    
    steps:
      - name: Approval Required
        run: echo "Manual approval required for production deployment"

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: approve
    environment: production
    
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version }}
      
      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'
      
      - name: Configure kubectl
        run: |
          echo "${{ secrets.KUBECONFIG_PRODUCTION }}" | base64 -d > kubeconfig.yaml
          export KUBECONFIG=kubeconfig.yaml
      
      - name: Deploy to Kubernetes (Canary)
        run: |
          kubectl config use-context production
          
          # Deploy canary (10% traffic)
          helm upgrade --install quanthire-prod ./infra/kubernetes/helm/quanthire \
            -f ./infra/kubernetes/helm/values-production.yaml \
            --set image.tag=${{ inputs.version }} \
            --set canary.enabled=true \
            --set canary.weight=10 \
            --namespace quanthire-prod \
            --create-namespace \
            --wait
      
      - name: Monitor canary
        run: |
          # Monitor for 10 minutes
          sleep 600
          
          # Check error rate
          # TODO: Query Prometheus for error rate
      
      - name: Promote canary
        run: |
          # If canary is healthy, promote to 100%
          helm upgrade --install quanthire-prod ./infra/kubernetes/helm/quanthire \
            -f ./infra/kubernetes/helm/values-production.yaml \
            --set image.tag=${{ inputs.version }} \
            --set canary.enabled=false \
            --namespace quanthire-prod \
            --wait
      
      - name: Run smoke tests
        run: |
          sleep 30
          
          # Test API
          curl -f https://api.quanthire.ai/health || exit 1
          
          # Test Web
          curl -f https://quanthire.ai/ || exit 1
      
      - name: Notify success
        if: success()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: "✅ Production deployment successful: ${{ inputs.version }}"
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
      
      - name: Rollback on failure
        if: failure()
        run: |
          helm rollback quanthire-prod --namespace quanthire-prod
      
      - name: Notify failure
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: "❌ Production deployment failed and rolled back: ${{ inputs.version }}"
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}

