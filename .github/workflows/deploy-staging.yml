name: Deploy to Staging

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    environment: staging
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      
      - name: Build and push images
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --target production \
            --tag ${{ secrets.REGISTRY_URL }}/quanthire/api:${{ github.sha }} \
            --tag ${{ secrets.REGISTRY_URL }}/quanthire/api:staging \
            --file ./infra/docker/api.Dockerfile \
            --push \
            .
          
          docker buildx build \
            --platform linux/amd64 \
            --target production \
            --tag ${{ secrets.REGISTRY_URL }}/quanthire/web:${{ github.sha }} \
            --tag ${{ secrets.REGISTRY_URL }}/quanthire/web:staging \
            --file ./infra/docker/web.Dockerfile \
            --push \
            .
          
          docker buildx build \
            --platform linux/amd64 \
            --target production \
            --tag ${{ secrets.REGISTRY_URL }}/quanthire/worker:${{ github.sha }} \
            --tag ${{ secrets.REGISTRY_URL }}/quanthire/worker:staging \
            --file ./infra/docker/worker.Dockerfile \
            --push \
            .
      
      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'
      
      - name: Configure kubectl
        run: |
          echo "${{ secrets.KUBECONFIG_STAGING }}" | base64 -d > kubeconfig.yaml
          export KUBECONFIG=kubeconfig.yaml
      
      - name: Deploy to Kubernetes
        run: |
          kubectl config use-context staging
          helm upgrade --install quanthire-staging ./infra/kubernetes/helm/quanthire \
            -f ./infra/kubernetes/helm/values-staging.yaml \
            --set image.tag=${{ github.sha }} \
            --namespace quanthire-staging \
            --create-namespace \
            --wait
      
      - name: Run smoke tests
        run: |
          # Wait for deployment
          sleep 30
          
          # Test API health
          curl -f https://api-staging.quanthire.ai/health || exit 1
          
          # Test Web health
          curl -f https://staging.quanthire.ai/ || exit 1
      
      - name: Notify deployment
        if: success()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: "✅ Staging deployment successful: ${{ github.sha }}"
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
      
      - name: Notify failure
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: "❌ Staging deployment failed: ${{ github.sha }}"
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}

