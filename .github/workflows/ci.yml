name: CI - Lint, Test, Build

on:
  push:
    branches: [main, develop, staging]
  pull_request:
    branches: [main, develop, staging]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  # ==================== Backend Linting ====================
  backend-lint:
    name: Backend - Lint & Type Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          cd apps/api
          pip install -r requirements.txt
          pip install black flake8 mypy bandit safety

      - name: Run Black (formatter check)
        run: |
          cd apps/api
          black --check app/

      - name: Run Flake8 (linter)
        run: |
          cd apps/api
          flake8 app/ --max-line-length=120 --extend-ignore=E203,W503

      - name: Run MyPy (type checker)
        run: |
          cd apps/api
          mypy app/ --ignore-missing-imports

  # ==================== Backend Unit Tests ====================
  backend-unit-tests:
    name: Backend - Unit Tests
    runs-on: ubuntu-latest
    needs: backend-lint
    
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: quanthire_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: quanthire_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          cd apps/api
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov

      - name: Run unit tests with coverage
        env:
          DATABASE_URL: postgresql+asyncpg://quanthire_test:test_password@localhost:5432/quanthire_test
          REDIS_URL: redis://localhost:6379/0
          APP_ENV: testing
          AUTH_MODE: none
          JWT_SECRET_KEY: test-jwt-secret-key-with-32-chars-minimum
          PYTHONPATH: apps/api:apps/agents:apps/agents/agents
        run: |
          cd tests
          pytest unit/ -v --cov=../apps/api/app --cov-report=term-missing

  # ==================== Backend Integration Tests ====================
  backend-integration-tests:
    name: Backend - Integration Tests
    runs-on: ubuntu-latest
    needs: backend-lint
    if: false
    steps:
      - run: echo "Integration test suite not yet implemented — skipped"

  # ==================== Frontend Linting ====================
  frontend-lint:
    name: Frontend - Lint & Type Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: |
          cd apps/web
          npm ci --legacy-peer-deps

      - name: Run ESLint
        run: |
          cd apps/web
          npm run lint

      - name: Run TypeScript type check
        run: |
          cd apps/web
          npx tsc --noEmit

  # ==================== Frontend Build ====================
  frontend-build:
    name: Frontend - Build
    runs-on: ubuntu-latest
    needs: frontend-lint
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: |
          cd apps/web
          npm ci --legacy-peer-deps

      - name: Build Next.js app
        env:
          NEXT_PUBLIC_API_URL: https://api.quanthire.ai/api/v1
        run: |
          cd apps/web
          npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: apps/web/.next
          retention-days: 7

  # ==================== E2E Tests ====================
  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [backend-unit-tests, frontend-build]
    if: false
    steps:
      - run: echo "E2E test suite not yet implemented — skipped"

  # ==================== Docker Build ====================
  docker-build:
    name: Docker - Build & Push
    runs-on: ubuntu-latest
    needs: [backend-unit-tests, frontend-build]
    if: false
    steps:
      - run: echo "Docker push disabled until registry secrets are configured — skipped"

  # ==================== Summary ====================
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [backend-unit-tests, backend-integration-tests, frontend-build, e2e-tests, docker-build]
    if: always()
    
    steps:
      - name: Check job results
        run: |
          echo "Backend Unit Tests: ${{ needs.backend-unit-tests.result }}"
          echo "Backend Integration Tests: ${{ needs.backend-integration-tests.result }}"
          echo "Frontend Build: ${{ needs.frontend-build.result }}"
          echo "E2E Tests: ${{ needs.e2e-tests.result }}"
          echo "Docker Build: ${{ needs.docker-build.result }}"

      - name: Fail if required jobs failed
        if: |
          needs.backend-unit-tests.result == 'failure' ||
          needs.frontend-build.result == 'failure'
        run: exit 1
