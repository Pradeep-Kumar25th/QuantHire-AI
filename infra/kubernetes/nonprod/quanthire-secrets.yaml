# QuantHire Non-Prod — all application secrets in one manifest.
#
# Usage (Jump VM, after filling real values from Key Vault / Azure portal):
#   kubectl apply -f infra/kubernetes/nonprod/quanthire-secrets.yaml
#
# Do NOT commit real passwords or API keys to GitHub.
# If secrets already exist on AKS, kubectl apply updates them in place.
#
apiVersion: v1
kind: Secret
metadata:
  name: quanthire-db-secret
  namespace: quanthire-nonprod
type: Opaque
stringData:
  DATABASE_URL: "REPLACE_WITH_POSTGRES_CONNECTION_STRING"
---
apiVersion: v1
kind: Secret
metadata:
  name: quanthire-blob-secret
  namespace: quanthire-nonprod
type: Opaque
stringData:
  AZURE_STORAGE_CONNECTION_STRING: "REPLACE_WITH_STORAGE_CONNECTION_STRING"
---
apiVersion: v1
kind: Secret
metadata:
  name: quanthire-aoai-secret
  namespace: quanthire-nonprod
type: Opaque
stringData:
  AZURE_OPENAI_API_KEY: "REPLACE_WITH_AZURE_OPENAI_API_KEY"
---
apiVersion: v1
kind: Secret
metadata:
  name: quanthire-di-secret
  namespace: quanthire-nonprod
type: Opaque
stringData:
  AZURE_DOCUMENT_INTELLIGENCE_KEY: "REPLACE_WITH_DOCUMENT_INTELLIGENCE_KEY"
---
apiVersion: v1
kind: Secret
metadata:
  name: quanthire-auth-secret
  namespace: quanthire-nonprod
type: Opaque
stringData:
  JWT_SECRET_KEY: "REPLACE_WITH_JWT_SECRET_KEY"
---
apiVersion: v1
kind: Secret
metadata:
  name: quanthire-entra-secret
  namespace: quanthire-nonprod
type: Opaque
stringData:
  # AIL-QUANTHIRE-NPD client secret — backend Graph role lookup only (never in frontend/Git)
  AZURE_AD_CLIENT_SECRET: "REPLACE_WITH_ENTRA_CLIENT_SECRET"
