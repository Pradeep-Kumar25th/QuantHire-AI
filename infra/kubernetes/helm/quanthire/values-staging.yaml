# Staging environment overrides (LEGACY - merged with chart values.yaml defaults)
# For Azure Non-Prod use values-nonprod.yaml, NOT this file.

replicaCount:
  api: 1
  web: 1
  worker: 2

image:
  tag: "staging"

ingress:
  hosts:
    - host: staging.quanthire.ai
      paths:
        - path: /
          pathType: Prefix
          service: web
        - path: /api
          pathType: Prefix
          service: api
  tls:
    - secretName: quanthire-staging-tls
      hosts:
        - staging.quanthire.ai

resources:
  api:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 512Mi
  web:
    limits:
      cpu: 250m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi
  worker:
    limits:
      cpu: 1000m
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 1Gi

autoscaling:
  enabled: false

postgresql:
  primary:
    persistence:
      size: 10Gi

redis:
  master:
    persistence:
      size: 4Gi

env:
  APP_ENV: staging
  DEBUG: "true"
  LOG_LEVEL: DEBUG
  LLM_DAILY_BUDGET_USD: "50"

