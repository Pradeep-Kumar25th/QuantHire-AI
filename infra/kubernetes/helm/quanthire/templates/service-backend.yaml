apiVersion: v1
kind: Service
metadata:
  name: quanthire-backend
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    {{- include "quanthire.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.api.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "quanthire.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
