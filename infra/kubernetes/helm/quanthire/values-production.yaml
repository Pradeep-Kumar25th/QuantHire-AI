# Production environment overrides (LEGACY - image registry/tag not set for ACR)
# For Azure Non-Prod use values-nonprod.yaml, NOT this file.

replicaCount:
  api: 3
  web: 3
  worker: 5

image:
  tag: "latest"

ingress:
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rate-limit: "100"
  hosts:
    - host: quanthire.ai
      paths:
        - path: /
          pathType: Prefix
          service: web
        - path: /api
          pathType: Prefix
          service: api
    - host: api.quanthire.ai
      paths:
        - path: /
          pathType: Prefix
          service: api
  tls:
    - secretName: quanthire-prod-tls
      hosts:
        - quanthire.ai
        - api.quanthire.ai

resources:
  api:
    limits:
      cpu: 2000m
      memory: 4Gi
    requests:
      cpu: 1000m
      memory: 2Gi
  web:
    limits:
      cpu: 1000m
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 1Gi
  worker:
    limits:
      cpu: 4000m
      memory: 8Gi
    requests:
      cpu: 2000m
      memory: 4Gi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 60
  targetMemoryUtilizationPercentage: 70

postgresql:
  primary:
    persistence:
      size: 100Gi
    resources:
      limits:
        cpu: 4000m
        memory: 8Gi
      requests:
        cpu: 2000m
        memory: 4Gi

redis:
  master:
    persistence:
      size: 20Gi
    resources:
      limits:
        cpu: 1000m
        memory: 2Gi
      requests:
        cpu: 500m
        memory: 1Gi

env:
  APP_ENV: production
  DEBUG: "false"
  LOG_LEVEL: INFO
  LLM_DAILY_BUDGET_USD: "200"

