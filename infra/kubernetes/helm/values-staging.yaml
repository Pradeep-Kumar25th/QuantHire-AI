# Staging Values for QuantHireAI Helm Chart
# NOTE: For the Azure Non-Prod deployment use quanthire/values-nonprod.yaml,
# NOT this file. This file targets a future staging environment.

replicaCount:
  api: 2
  web: 2
  worker: 2

image:
  registry: "crailnpdwe01.azurecr.io"
  repository: quanthire
  backend:
    repository: quanthire-backend
  frontend:
    repository: quanthire-frontend
  worker:
    repository: quanthire-worker
  pullPolicy: Always
  tag: "0.1.0"

service:
  type: ClusterIP
  api:
    port: 8000
  web:
    port: 3000

resources:
  api:
    requests:
      cpu: "250m"
      memory: "256Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"
  web:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "250m"
      memory: "256Mi"
  worker:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "2000m"
      memory: "2Gi"

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-staging"
  hosts:
    - host: api-staging.quanthire.ai
      paths:
        - path: /
          pathType: Prefix
          service: web
        - path: /api
          pathType: Prefix
          service: api
  tls:
    - secretName: quanthire-api-staging-tls
      hosts:
        - api-staging.quanthire.ai

# Must match the Service name in templates/service-backend.yaml ("quanthire-backend")
bff:
  backendUrl: "http://quanthire-backend:8000"

config:
  deploymentTarget: "aks"
  appEnv: "staging"
  authMode: "entra_sso"
  debug: "true"
  logLevel: "DEBUG"
  llmProvider: "openai"
  embeddingProvider: "azure_openai"
  embeddingDimension: "768"
  vectorStore: "postgres"
  milvusEnabled: false
  langgraphCheckpointBackend: "postgres"
  postgres:
    host: "quanthire-staging-postgres.postgres.database.azure.com"
    database: "quanthire_staging"
    port: 5432
    sslmode: "require"
  openai:
    endpoint: "https://oai-aihub-staging.openai.azure.com/"
    apiVersion: "2024-02-15-preview"
    chatDeployment: "gpt-4o"
    embeddingDeployment: "text-embedding-3-small"
  storage:
    accountName: "staihubchatbotstaging"
    container: "uploads"
    containerProcessed: "processed"
    blobEndpoint: "https://staihubchatbotstaging.blob.core.windows.net/"
  documentIntelligence:
    enabled: false
    endpoint: ""
    model: "prebuilt-layout"

secrets:
  db:
    name: "quanthire-db-secret"
    keys:
      - DATABASE_URL
  blob:
    name: "quanthire-blob-secret"
    keys:
      - AZURE_STORAGE_CONNECTION_STRING
  openai:
    name: "quanthire-aoai-secret"
    keys:
      - AZURE_OPENAI_API_KEY
  di:
    name: "quanthire-di-secret"
    keys:
      - AZURE_DOCUMENT_INTELLIGENCE_KEY
  auth:
    name: "quanthire-auth-secret"
    keys:
      - JWT_SECRET_KEY
