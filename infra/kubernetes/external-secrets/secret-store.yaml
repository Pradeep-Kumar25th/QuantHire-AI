# External Secrets Operator Configuration
# Syncs secrets from Azure Key Vault to Kubernetes

apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: azure-keyvault-store
  namespace: quanthire-prod
spec:
  provider:
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: https://quanthire-prod-kv.vault.azure.net
      serviceAccountRef:
        name: external-secrets-sa
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: quanthire-secrets
  namespace: quanthire-prod
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-keyvault-store
    kind: SecretStore
  
  target:
    name: quanthire-secrets
    creationPolicy: Owner
  
  dataFrom:
    - extract:
        key: postgres-connection-string
    - extract:
        key: redis-connection-string
    - extract:
        key: openai-api-key
    - extract:
        key: anthropic-api-key
    - extract:
        key: nextauth-secret
    - extract:
        key: jwt-secret
    - extract:
        key: sentry-dsn
    - extract:
        key: langchain-api-key
    - extract:
        key: microsoft-graph-client-id
    - extract:
        key: microsoft-graph-client-secret
---
# Service Account for External Secrets
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-sa
  namespace: quanthire-prod
  annotations:
    azure.workload.identity/client-id: "AZURE_CLIENT_ID"
    azure.workload.identity/tenant-id: "AZURE_TENANT_ID"
---
